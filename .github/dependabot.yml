version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      github-actions:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "npm"
    directories: ["/app", "/installer", "/azure/web"]
    groups:
      # Rayfin ships every package at the same version, and the installer exe build fails when the
      # app's rayfin-cli and rayfin-core differ. The app pins them exactly so they move only together.
      rayfin:
        patterns: ["@microsoft/rayfin-*"]
      npm:
        patterns: ["*"]
        exclude-patterns: ["@microsoft/rayfin-*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "pip"
    directories: ["/azure/jobs", "/core"]
    groups:
      pip:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "docker"
    directories: ["/azure/jobs", "/azure/web"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7