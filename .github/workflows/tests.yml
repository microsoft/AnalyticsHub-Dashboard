name: tests

on:
  push:
    branches: [main]
  # Every base, so stacked pull requests are tested too.
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest==9.1.1 duckdb==1.5.5 pandas==3.0.5 urllib3==2.7.0 requests==2.32.5
      - name: Run offline regression tests
        # PySpark/Java are optional: the existing local-Spark check skips without them.
        run: python -B -m pytest tests -q -ra

  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: 'installer'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      # The lock files may resolve through Microsoft's internal mirror of npm, which runners can't reach.
      - name: Use the public npm registry
        run: node packaging/public-registry.js package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck

  valuelens-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Use the public npm registry
        run: node "installer/packaging/public-registry.js" "azure/web/package-lock.json"
      - name: Install and test
        working-directory: 'azure/web'
        run: |
          npm ci --no-audit --no-fund
          npm test

  arm-drift:
    # The installer ships a compiled copy of azure/infra; it must match the Bicep source.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the Bicep template
        run: |
          az bicep install
          az bicep build --file "azure/infra/main.bicep" --outfile "${{ runner.temp }}/main.arm.json"
      - name: Compare with the installer's copy
        shell: python
        run: |
          import json, os, sys
          def load(p):
              d = json.load(open(p, encoding="utf-8"))
              d.get("metadata", {}).pop("_generator", None)
              return d
          built = load(os.path.join(os.environ["RUNNER_TEMP"], "main.arm.json"))
          shipped = load("installer/src/azure/main.arm.json")
          if built != shipped:
              sys.exit("installer/src/azure/main.arm.json is out of date: rebuild it from azure/infra/main.bicep.")
          print("ARM template matches the Bicep source.")