name: azure-images

# Builds the two container images the Azure-hosted Analytics Hub runs: valuelens-jobs (collect,
# process, publish, refresh) and valuelens-web (the app and its /api/query proxy). The installer
# deploys ghcr.io/microsoft/<image>:<installer version>, so an installer-v* tag pushes both images
# with that version. Pull requests only check that they build.

on:
  workflow_dispatch:
  push:
    tags: ['installer-v*']
  pull_request:
    paths:
      - 'azure/jobs/**'
      - 'azure/web/**'
      - 'azure/sql/**'
      - 'core/**'
      - 'app/**'
      - '.github/workflows/azure-images.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [valuelens-jobs, valuelens-web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The lock files may resolve through Microsoft's internal mirror of npm, which runners can't reach.
      - name: Use the public npm registry
        if: matrix.image == 'valuelens-web'
        run: node "installer/packaging/public-registry.js" "app/package-lock.json" "azure/web/package-lock.json"

      - name: Work out the tag
        id: tag
        run: |
          version=$(node -p "require('./installer/package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/installer-v* && "$GITHUB_REF_NAME" != "installer-v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME doesn't match the installer's version $version." >&2; exit 1
          fi
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}:$version" >> "$GITHUB_OUTPUT"

      # The source label links the package on GHCR to this repo.
      - name: Build
        run: |
          dockerfile="azure/${{ matrix.image == 'valuelens-jobs' && 'jobs' || 'web' }}/Dockerfile"
          docker build -f "$dockerfile" -t "${{ steps.tag.outputs.image }}" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" .

      - name: Smoke-test the jobs image
        if: matrix.image == 'valuelens-jobs'
        run: docker run --rm "${{ steps.tag.outputs.image }}" --help

      # The web image must serve the Brotli and gzip copies of the app's files that precompress.js made at build.
      # The whole server can't start here (its settings store needs a managed identity at start-up), so this runs
      # the image's own static handler on its public folder, with no network.
      - name: Smoke-test the web image
        if: matrix.image == 'valuelens-web'
        run: |
          docker run --rm --network none --entrypoint node "${{ steps.tag.outputs.image }}" --input-type=module -e '
            import http from "node:http";
            import zlib from "node:zlib";
            import { createStaticHandler } from "/app/src/static.js";
            const serve = createStaticHandler("/app/public");
            const server = http.createServer(async (req, res) => {
              if (!(await serve(req, res, new URL(req.url, "http://localhost").pathname))) { res.statusCode = 404; res.end(); }
            });
            await new Promise((resolve) => server.listen(0, "127.0.0.1", resolve));
            const get = (path, encoding) => new Promise((resolve, reject) => {
              const headers = encoding ? { "Accept-Encoding": encoding } : {};
              http.get({ host: "127.0.0.1", port: server.address().port, path, headers, agent: false }, (res) => {
                const chunks = [];
                res.on("data", (chunk) => chunks.push(chunk));
                res.on("end", () => resolve({ status: res.statusCode, encoding: res.headers["content-encoding"], body: Buffer.concat(chunks) }));
              }).on("error", reject);
            });
            const entry = /src="(\/assets\/[^"]+\.js)"/.exec((await get("/")).body.toString())?.[1];
            if (!entry) throw new Error("index.html names no entry script");
            const raw = await get(entry), br = await get(entry, "br"), gz = await get(entry, "gzip");
            if (raw.status !== 200 || raw.encoding) throw new Error(`${entry}: ${raw.status} ${raw.encoding}`);
            if (br.encoding !== "br" || !zlib.brotliDecompressSync(br.body).equals(raw.body)) throw new Error(`${entry} is not sent as its Brotli copy`);
            if (gz.encoding !== "gzip" || !zlib.gunzipSync(gz.body).equals(raw.body)) throw new Error(`${entry} is not sent as its gzip copy`);
            console.log(`${entry}: ${raw.body.length} bytes, sent as ${br.body.length} with br and ${gz.body.length} with gzip`);
            server.close();
          '

      - name: Push
        if: startsWith(github.ref, 'refs/tags/installer-v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "${{ steps.tag.outputs.image }}"
