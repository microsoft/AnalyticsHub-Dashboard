name: azure-images

# Builds the two container images the Azure-hosted Analytics Hub runs: valuelens-jobs (collect,
# process, publish, refresh) and valuelens-web (the app and its /api/query proxy). The installer
# deploys ghcr.io/microsoft/<image>:<installer version>, so an installer-v* tag pushes both images
# with that version. Pull requests only check that they build.

on:
  workflow_dispatch:
  push:
    tags: ['installer-v*']
  pull_request:
    paths:
      - 'azure/jobs/**'
      - 'azure/web/**'
      - 'azure/sql/**'
      - 'core/**'
      - 'app/**'
      - '.github/workflows/azure-images.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [valuelens-jobs, valuelens-web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The lock files may resolve through Microsoft's internal mirror of npm, which runners can't reach.
      - name: Use the public npm registry
        if: matrix.image == 'valuelens-web'
        run: node "installer/packaging/public-registry.js" "app/package-lock.json" "azure/web/package-lock.json"

      - name: Work out the tag
        id: tag
        run: |
          version=$(node -p "require('./installer/package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/installer-v* && "$GITHUB_REF_NAME" != "installer-v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME doesn't match the installer's version $version." >&2; exit 1
          fi
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}:$version" >> "$GITHUB_OUTPUT"

      # The source label links the package on GHCR to this repo.
      - name: Build
        run: |
          dockerfile="azure/${{ matrix.image == 'valuelens-jobs' && 'jobs' || 'web' }}/Dockerfile"
          docker build -f "$dockerfile" -t "${{ steps.tag.outputs.image }}" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" .

      - name: Smoke-test the jobs image
        if: matrix.image == 'valuelens-jobs'
        run: docker run --rm "${{ steps.tag.outputs.image }}" --help

      # The web image must start and serve the Brotli and gzip copies of the app's files that precompress.js made at build.
      # The storage account is a placeholder: nothing here calls Azure.
      - name: Smoke-test the web image
        if: matrix.image == 'valuelens-web'
        run: |
          docker run -d --name web -p 8080:8080 -e VALUELENS_STORAGE_ACCOUNT=smoketest "${{ steps.tag.outputs.image }}"
          trap 'docker logs web; docker rm -f web > /dev/null' EXIT
          for i in $(seq 30); do curl -fs http://localhost:8080/api/health && break; sleep 1; done
          entry=$(curl -fsS http://localhost:8080/ | grep -oE 'src="/assets/[^"]+\.js"' | head -n 1 | cut -d '"' -f 2)
          test -n "$entry"
          cd "$RUNNER_TEMP"
          curl -fsS -o entry.js "http://localhost:8080$entry"
          for encoding in br gzip; do
            curl -fsS -D headers -o "entry.$encoding" -H "Accept-Encoding: $encoding" "http://localhost:8080$entry"
            tr -d '\r' < headers | grep -qix "content-encoding: $encoding"
          done
          ENTRY="$entry" node -e '
            const { readFileSync } = require("fs"), zlib = require("zlib");
            const raw = readFileSync("entry.js"), br = readFileSync("entry.br"), gz = readFileSync("entry.gzip");
            if (!zlib.brotliDecompressSync(br).equals(raw) || !zlib.gunzipSync(gz).equals(raw)) process.exit(1);
            console.log(`${process.env.ENTRY}: ${raw.length} bytes, sent as ${br.length} with br and ${gz.length} with gzip`);
          '

      - name: Push
        if: startsWith(github.ref, 'refs/tags/installer-v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "${{ steps.tag.outputs.image }}"
