name: Publish wiki

# docs/ is the source of truth. On every change to it on main, this publishes it to the wiki.
# The wiki needs one page before it can be cloned: open the Wiki tab, choose
# "Create the first page", save it, then run this workflow.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/scripts/publish_wiki.py'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Clone the wiki
        id: wiki
        env:
          # If organisation policy stops GITHUB_TOKEN writing to the wiki, add a WIKI_TOKEN secret:
          # a fine-grained token with Contents read and write on this repository.
          TOKEN: ${{ secrets.WIKI_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The wiki isn't set up yet. Open the Wiki tab, create the first page, then run this workflow again."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the pages
        if: steps.wiki.outputs.ready == 'true'
        run: python .github/scripts/publish_wiki.py --out wiki --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}"
      - name: Push
        if: steps.wiki.outputs.ready == 'true'
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is up to date."
            exit 0
          fi
          git commit -q -m "Publish docs from ${GITHUB_SHA::7}"
          git push -q
